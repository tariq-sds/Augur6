name: Build Augur-6 for macOS

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure universal build (Intel + Apple Silicon)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3 and AU
        run: cmake --build build --config Release --target Augur6_VST3 Augur6_AU -j 4

      - name: Sign and package
        run: |
          VST3=$(find build -type d -name "Augur-6.vst3" | head -1)
          AU=$(find build -type d -name "Augur-6.component" | head -1)
          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AU"
          mkdir -p "dist/Augur-6"
          cp -R "$VST3" "$AU" "dist/Augur-6/"
          cp install.sh README.md "dist/Augur-6/"
          cd dist && ditto -c -k --keepParent "Augur-6" "../Augur-6-macOS.zip"

      - name: Validate Audio Unit
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/Augur-6/Augur-6.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aumu Agr6 Toot

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Augur-6-macOS
          path: Augur-6-macOS.zip
