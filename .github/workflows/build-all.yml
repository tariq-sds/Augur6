name: Build Toota Audio plugins for macOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: Augur6
            targets: "Augur6_VST3 Augur6_AU"
            au: "aumu:Agr6"
          - folder: Wayfarer
            targets: "Wayfarer_VST3 Wayfarer_AU"
            au: "aumu:Wyfr"
          - folder: Relay
            targets: "Relay_VST3 Relay_AU"
            au: "aufx:Rlay"
          - folder: Vault
            targets: "Vault_VST3 Vault_AU"
            au: "aufx:Vlt1"
          - folder: Mixdown
            targets: "TootaStrip_VST3 TootaStrip_AU TootaMaster_VST3 TootaMaster_AU"
            au: "aufx:TStr aufx:TMst"
          - folder: Interlock
            targets: "Interlock_VST3 Interlock_AU"
            au: "aufx:Itlk"
          - folder: Varia
            targets: "Varia_VST3 Varia_AU"
            au: "aufx:Vria"
          - folder: Clarion
            targets: "Clarion_VST3 Clarion_AU ClarionRoom_VST3 ClarionRoom_AU"
            au: "aufx:Clrn aufx:Clrm"
          - folder: Mirror
            targets: "Mirror_VST3 Mirror_AU"
            au: "aufx:Mirr"
          - folder: Arc
            targets: "Arc_VST3 Arc_AU ArcTap_VST3 ArcTap_AU"
            au: "aufx:Arcx aufx:ArcT"
    steps:
      - uses: actions/checkout@v4

      - name: Configure universal build (Intel + Apple Silicon)
        working-directory: ${{ matrix.folder }}
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3 and AU
        working-directory: ${{ matrix.folder }}
        run: cmake --build build --config Release --target ${{ matrix.targets }} -j 4

      - name: Sign and collect
        run: |
          mkdir -p out
          find "${{ matrix.folder }}/build" -type d \( -name "*.vst3" -o -name "*.component" \) -path "*_artefacts/*" -prune | while read -r p; do
            codesign --force --deep --sign - "$p"
            cp -R "$p" out/
          done
          ls -la out

      - name: Validate Audio Units
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R out/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          for code in ${{ matrix.au }}; do
            auval -v ${code%%:*} ${code##*:} Toot
          done

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.folder }}
          path: out

  package:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: Toota-Audio-Plugins
      - name: Toota Hits drum library
        run: |
          python3 -m pip install --quiet --break-system-packages numpy scipy || python3 -m pip install --quiet numpy scipy
          python3 Mixdown/Library/make_hits.py "Toota-Audio-Plugins/Toota Hits"
      - name: Package
        run: |
          cp install.sh README.md Toota-Audio-Plugins/
          mkdir -p "Toota-Audio-Plugins/Mirror Bridge (Max for Live)"
          cp Mirror/Bridge/Mirror-Bridge.amxd Mirror/Bridge/mirror-bridge.js Mirror/Bridge/mirror-panel.js "Toota-Audio-Plugins/Mirror Bridge (Max for Live)/"
          chmod +x Toota-Audio-Plugins/install.sh
          ls -la Toota-Audio-Plugins
      - uses: actions/upload-artifact@v4
        with:
          name: Toota-Audio-Plugins-macOS
          path: Toota-Audio-Plugins
